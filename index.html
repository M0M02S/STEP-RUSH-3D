<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Step Rush 3D - Infinite Overdrive</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: white;
      user-select: none;
    }
    canvas { display: block; touch-action: none; }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-start;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,.7);
      z-index: 10;
    }

    .card {
      background: rgba(15, 23, 42, .75);
      border: 1px solid rgba(96, 165, 250, .35);
      border-radius: 14px;
      padding: 10px 14px;
      min-width: 90px;
      backdrop-filter: blur(8px);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .label {
      display: block;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #93c5fd;
      margin-bottom: 2px;
    }

    .value {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
    }

    #tierBadge {
      position: fixed;
      top: 88px;
      left: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(34, 211, 238, 0.2);
      border: 1px solid rgba(34, 211, 238, 0.5);
      color: #67e8f9;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 10;
    }

    #speedBar {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: 16px;
      height: 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .85);
      border: 1px solid rgba(96, 165, 250, .35);
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }

    #speedFill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22d3ee, #3b82f6, #a855f7);
      transition: width .08s linear, background 0.3s ease;
    }

    #gameover {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(2, 6, 23, .76);
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    #gameover.hidden { display: none; }

    .panel {
      width: min(92vw, 440px);
      text-align: center;
      background: rgba(15, 23, 42, .95);
      border: 1px solid rgba(96, 165, 250, .45);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,.65);
    }

    .panel h1 {
      margin: 0 0 8px;
      font-size: 34px;
      letter-spacing: .03em;
    }

    .panel p {
      margin: 6px 0;
      color: #cbd5e1;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .stat-box {
      background: rgba(30, 41, 59, 0.7);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .final {
      font-size: 44px;
      font-weight: 900;
      color: #facc15;
      margin: 14px 0 4px;
    }

    button {
      margin-top: 14px;
      border: 0;
      border-radius: 999px;
      padding: 14px 26px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      color: #082f49;
      background: linear-gradient(90deg, #22d3ee, #60a5fa);
      box-shadow: 0 10px 30px rgba(34, 211, 238, .35);
      transition: transform 0.1s ease;
    }

    button:active { transform: translateY(2px); }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 42px;
      transform: translateX(-50%);
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 8px #000;
      width: 90%;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="card"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="card"><span class="label">Schritte</span><span class="value" id="steps">0</span></div>
    <div class="card"><span class="label">Combo</span><span class="value" id="combo">x1</span></div>
    <div class="card"><span class="label">Level</span><span class="value" id="level">1</span></div>
    <div class="card"><span class="label">Leben</span><span class="value" id="lives">❤️❤️❤️</span></div>
    <div class="card" id="speedCard"><span class="label">Speed</span><span class="value" id="speed">8.0</span></div>
  </div>

  <div id="tierBadge">Normal</div>

  <div id="speedBar"><div id="speedFill"></div></div>
  <div id="hint">A/D oder ←/→ = Spur · Leertaste/W/↑ = springen · Mobil: wischen</div>

  <div id="gameover" class="hidden">
    <div class="panel">
      <h1>Game Over</h1>
      <p>Dein Run ist vorbei.</p>
      <div class="final" id="finalScore">0</div>
      <p>Punkte</p>
      <div class="stats-grid">
        <div class="stat-box">
          <span class="label">Max Speed</span>
          <span class="value" id="finalMaxSpeed" style="font-size: 18px;">8.0</span>
        </div>
        <div class="stat-box">
          <span class="label">Schritte</span>
          <span class="value" id="finalSteps" style="font-size: 18px;">0</span>
        </div>
      </div>
      <button id="restartBtn">Nochmal schneller!</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Einfacher Web Audio Synthesizer (ohne externe Dateien) ----------
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type, comboVal = 1) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'step') {
        osc.type = 'sine';
        const baseFreq = 420 + Math.min(comboVal, 25) * 28;
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.45, now + 0.11);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'jump') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(480, now + 0.16);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.start(now);
        osc.stop(now + 0.16);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(42, now + 0.28);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.start(now);
        osc.stop(now + 0.28);
      }
    }

    // ---------- Grundsetup ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1020);
    scene.fog = new THREE.Fog(0x0b1020, 32, 115);

    const baseCameraPos = new THREE.Vector3(0, 5.4, 10);
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 250);
    camera.position.copy(baseCameraPos);
    camera.lookAt(0, 1.2, -16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // ---------- Licht ----------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(6, 14, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0x3b82f6, 0.9);
    rim.position.set(-8, 6, -10);
    scene.add(rim);

    const playerAuraLight = new THREE.PointLight(0x22d3ee, 0, 9);
    playerAuraLight.position.set(0, 1.5, 0);
    scene.add(playerAuraLight);

    // ---------- Straße & Umgebung ----------
    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(9, 280),
      new THREE.MeshStandardMaterial({ color: 0x141d36, roughness: 0.9, metalness: 0.1 })
    );
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0, -65);
    road.receiveShadow = true;
    scene.add(road);

    // Fahrspurlinien
    const laneLines = [];
    for (const x of [-1, 1]) {
      const mat = new THREE.MeshStandardMaterial({
        color: 0x3b82f6,
        emissive: 0x1d4ed8,
        emissiveIntensity: 0.7
      });
      const line = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.02, 280), mat);
      line.position.set(x, 0.02, -65);
      scene.add(line);
      laneLines.push(line);
    }

    // Neon-Seitenbegrenzungen
    const rails = [];
    for (const x of [-4.75, 4.75]) {
      const mat = new THREE.MeshStandardMaterial({
        color: 0x1e40af,
        emissive: 0x2563eb,
        emissiveIntensity: 0.6
      });
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.55, 280), mat);
      rail.position.set(x, 0.28, -65);
      rail.castShadow = true;
      rail.receiveShadow = true;
      scene.add(rail);
      rails.push(rail);
    }

    // Bewegliche Geschwindigkeits-Markierungen & Seitenpfeiler für echtes Speed-Feeling
    const roadStripes = [];
    const sidePillars = [];
    const stripeGeo = new THREE.BoxGeometry(0.28, 0.025, 2.2);
    const stripeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.45 });

    const pillarGeo = new THREE.BoxGeometry(0.35, 4.5, 0.35);
    const pillarMat = new THREE.MeshStandardMaterial({
      color: 0x1e293b,
      emissive: 0x3b82f6,
      emissiveIntensity: 0.5
    });

    for (let z = 10; z > -130; z -= 10) {
      for (const x of [-2, 0, 2]) {
        const stripe = new THREE.Mesh(stripeGeo, stripeMat);
        stripe.position.set(x, 0.015, z);
        scene.add(stripe);
        roadStripes.push(stripe);
      }

      for (const sideX of [-6.2, 6.2]) {
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(sideX, 2.25, z);
        scene.add(pillar);
        sidePillars.push(pillar);
      }
    }

    // ---------- Detaillierter Spieler mit Gelenken für Geh-Animation ----------
    const player = new THREE.Group();
    const characterRig = new THREE.Group();
    player.add(characterRig);

    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0x22d3ee,
      emissive: 0x0891b2,
      emissiveIntensity: 0.65,
      roughness: 0.35,
      metalness: 0.25
    });

    const limbMat = new THREE.MeshStandardMaterial({
      color: 0x0ea5e9,
      emissive: 0x0369a1,
      emissiveIntensity: 0.45,
      roughness: 0.4,
      metalness: 0.3
    });

    // Torso
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.92, 0.48), bodyMat);
    torso.position.y = 1.08;
    torso.castShadow = true;
    characterRig.add(torso);

    // Kopf + Visier
    const headGroup = new THREE.Group();
    headGroup.position.set(0, 1.82, 0);
    characterRig.add(headGroup);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.33, 20, 20),
      new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.45 })
    );
    head.castShadow = true;
    headGroup.add(head);

    const visorMat = new THREE.MeshStandardMaterial({
      color: 0x0f172a,
      emissive: 0x22d3ee,
      emissiveIntensity: 0.8
    });
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.13, 0.1), visorMat);
    visor.position.set(0, 0.02, -0.31);
    headGroup.add(visor);

    // Funktion für Arme & Beine mit sauberem Drehpunkt (Pivot) oben am Gelenk
    function createLimb(w, h, d, mat, pivotX, pivotY, pivotZ) {
      const pivot = new THREE.Group();
      pivot.position.set(pivotX, pivotY, pivotZ);
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.y = -h / 2;
      mesh.castShadow = true;
      pivot.add(mesh);
      return pivot;
    }

    const leftLeg = createLimb(0.26, 0.68, 0.28, limbMat, -0.21, 0.68, 0);
    const rightLeg = createLimb(0.26, 0.68, 0.28, limbMat, 0.21, 0.68, 0);
    const leftArm = createLimb(0.22, 0.66, 0.24, limbMat, -0.53, 1.46, 0);
    const rightArm = createLimb(0.22, 0.66, 0.24, limbMat, 0.53, 1.46, 0);

    characterRig.add(leftLeg, rightLeg, leftArm, rightArm);

    // Energie-Aura-Ring um den Spieler (für hohe Geschwindigkeiten)
    const auraRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.85, 0.04, 8, 32),
      new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0 })
    );
    auraRing.rotation.x = Math.PI / 2;
    auraRing.position.y = 0.06;
    player.add(auraRing);

    player.position.set(0, 0, 0);
    scene.add(player);

    // ---------- Partikel & Blitz-System für Speed-Effekte ----------
    const particles = [];
    const particleGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);

    function spawnParticle(pos, colorHex, velocity, life = 0.45, scale = 1) {
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.95
      });
      const mesh = new THREE.Mesh(particleGeo, mat);
      mesh.position.copy(pos);
      mesh.scale.setScalar(scale);
      scene.add(mesh);
      particles.push({
        mesh,
        vel: velocity,
        life,
        maxLife: life
      });
    }

    // 3D-Blitze um den Spieler im Blitz-Modus
    const lightningBolts = [];
    function spawnLightningAroundPlayer() {
      const points = [];
      const startAngle = Math.random() * Math.PI * 2;
      const radius = 0.75 + Math.random() * 0.45;
      let curX = player.position.x + Math.cos(startAngle) * radius;
      let curY = player.position.y + 0.1;
      let curZ = player.position.z + Math.sin(startAngle) * radius;

      points.push(new THREE.Vector3(curX, curY, curZ));
      const segments = 5;
      for (let i = 1; i <= segments; i++) {
        curX += (Math.random() - 0.5) * 0.65;
        curY += (2.1 / segments);
        curZ += (Math.random() - 0.5) * 0.65;
        points.push(new THREE.Vector3(curX, curY, curZ));
      }

      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const isOverdrive = speed >= 110;
      const mat = new THREE.LineBasicMaterial({
        color: isOverdrive ? 0xf472b6 : 0xc084fc,
        transparent: true,
        opacity: 1
      });
      const line = new THREE.Line(geo, mat);
      scene.add(line);
      lightningBolts.push({ line, life: 0.12 });
    }

    // ---------- Spielzustand (Unendliche Geschwindigkeit!) ----------
    const lanes = [-2, 0, 2];
    const minSpeed = 8;

    let laneIndex = 1;
    let jumpY = 0;
    let velocityY = 0;
    let onGround = true;

    let speed = minSpeed;
    let peakSpeed = minSpeed;
    let steps = 0;
    let score = 0;
    let combo = 1;
    let lives = 3;
    let gameOver = false;

    let walkCycle = 0;
    let shakeIntensity = 0;
    let waveTimer = 0;
    let effectTimer = 0;

    const objects = [];

    // ---------- UI ----------
    const ui = {
      score: document.getElementById('score'),
      steps: document.getElementById('steps'),
      combo: document.getElementById('combo'),
      level: document.getElementById('level'),
      lives: document.getElementById('lives'),
      speed: document.getElementById('speed'),
      speedCard: document.getElementById('speedCard'),
      speedFill: document.getElementById('speedFill'),
      tierBadge: document.getElementById('tierBadge'),
      gameover: document.getElementById('gameover'),
      finalScore: document.getElementById('finalScore'),
      finalMaxSpeed: document.getElementById('finalMaxSpeed'),
      finalSteps: document.getElementById('finalSteps')
    };

    // ---------- Speed-Stufen & Effekte ----------
    function getSpeedTier(spd) {
      if (spd >= 110) {
        return {
          name: '⚡🔥 KOSMISCHER OVERDRIVE',
          color: 0xf472b6,
          emissive: 0xdb2777,
          fogColor: 0x1e0924,
          badgeBg: 'rgba(244, 114, 182, 0.25)',
          badgeBorder: '#f472b6',
          badgeText: '#fbcfe8',
          barGradient: 'linear-gradient(90deg, #f59e0b, #ec4899, #8b5cf6, #22d3ee)'
        };
      }
      if (spd >= 70) {
        return {
          name: '⚡ BLITZ-MODUS',
          color: 0xc084fc,
          emissive: 0x7e22ce,
          fogColor: 0x160d2e,
          badgeBg: 'rgba(168, 85, 247, 0.25)',
          badgeBorder: '#c084fc',
          badgeText: '#e9d5ff',
          barGradient: 'linear-gradient(90deg, #3b82f6, #a855f7, #e879f9)'
        };
      }
      if (spd >= 40) {
        return {
          name: '🔥 FEUER-MODUS',
          color: 0xf97316,
          emissive: 0xc2410c,
          fogColor: 0x220d0b,
          badgeBg: 'rgba(249, 115, 22, 0.25)',
          badgeBorder: '#fb923c',
          badgeText: '#fed7aa',
          barGradient: 'linear-gradient(90deg, #facc15, #f97316, #ef4444)'
        };
      }
      if (spd >= 20) {
        return {
          name: '💨 TURBO-AURA',
          color: 0x38bdf8,
          emissive: 0x0284c7,
          fogColor: 0x0b1630,
          badgeBg: 'rgba(56, 189, 248, 0.22)',
          badgeBorder: '#38bdf8',
          badgeText: '#bae6fd',
          barGradient: 'linear-gradient(90deg, #22d3ee, #3b82f6, #6366f1)'
        };
      }
      return {
        name: 'Normal',
        color: 0x22d3ee,
        emissive: 0x0891b2,
        fogColor: 0x0b1020,
        badgeBg: 'rgba(34, 211, 238, 0.16)',
        badgeBorder: 'rgba(34, 211, 238, 0.45)',
        badgeText: '#67e8f9',
        barGradient: 'linear-gradient(90deg, #22d3ee, #3b82f6)'
      };
    }

    function updateUI() {
      const tier = getSpeedTier(speed);

      ui.score.textContent = Math.floor(score);
      ui.steps.textContent = steps;
      ui.combo.textContent = 'x' + combo;
      ui.level.textContent = Math.floor(steps / 10) + 1;
      ui.lives.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
      ui.speed.textContent = speed.toFixed(1);

      // Speed-Leiste skaliert logarithmisch/dynamisch für unendlichen Speed
      const fillPercent = Math.min(100, ((speed - minSpeed) / (speed + 25)) * 125);
      ui.speedFill.style.width = fillPercent + '%';
      ui.speedFill.style.background = tier.barGradient;

      ui.tierBadge.textContent = tier.name;
      ui.tierBadge.style.background = tier.badgeBg;
      ui.tierBadge.style.borderColor = tier.badgeBorder;
      ui.tierBadge.style.color = tier.badgeText;
      ui.speedCard.style.borderColor = tier.badgeBorder;
    }

    // ---------- Koordinierter Wellen-Spawner (verhindert unmögliche Wände) ----------
    function spawnWave() {
      const zPos = -95;
      const availableLanes = [0, 1, 2];

      // Zufällig entscheiden, wie viele Hindernisse in dieser Welle erscheinen (1 bis 2)
      const obstacleCount = Math.random() < 0.45 ? 2 : 1;

      // Spuren mischen
      for (let i = availableLanes.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [availableLanes[i], availableLanes[j]] = [availableLanes[j], availableLanes[i]];
      }

      const obstacleLanes = availableLanes.slice(0, obstacleCount);
      const freeLanes = availableLanes.slice(obstacleCount);

      // Hindernisse platzieren
      for (const lane of obstacleLanes) {
        const low = Math.random() < 0.4;
        const height = low ? 0.8 : 2.0;

        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(low ? 1.5 : 1.1, height, 1.1),
          new THREE.MeshStandardMaterial({
            color: low ? 0xf59e0b : 0xef4444,
            emissive: low ? 0x7c2d12 : 0x7f1d1d,
            emissiveIntensity: 0.75,
            roughness: 0.35
          })
        );

        mesh.position.set(lanes[lane], height / 2, zPos);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData = { type: 'obstacle', lane, low, hit: false };

        scene.add(mesh);
        objects.push(mesh);
      }

      // Sammel-Ring immer auf einer garantiert freien Spur platzieren!
      if (freeLanes.length > 0 && Math.random() < 0.85) {
        const stepLane = freeLanes[0];
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.38, 0.13, 12, 24),
          new THREE.MeshStandardMaterial({
            color: 0xfacc15,
            emissive: 0xf59e0b,
            emissiveIntensity: 1.25,
            roughness: 0.25,
            metalness: 0.5
          })
        );

        ring.rotation.x = Math.PI / 2;
        ring.position.set(lanes[stepLane], 1.05, zPos);
        ring.castShadow = true;
        ring.userData = { type: 'step', lane: stepLane, collected: false };

        scene.add(ring);
        objects.push(ring);
      }
    }

    // ---------- Steuerung ----------
    function moveLane(dir) {
      if (gameOver) return;
      initAudio();
      laneIndex = THREE.MathUtils.clamp(laneIndex + dir, 0, 2);
    }

    function jump() {
      if (gameOver || !onGround) return;
      initAudio();
      velocityY = 8.2;
      onGround = false;
      playSound('jump');

      // Kleine Sprung-Partikel unter den Füßen
      for (let i = 0; i < 6; i++) {
        spawnParticle(
          new THREE.Vector3(player.position.x + (Math.random() - 0.5) * 0.5, 0.1, 0),
          0x38bdf8,
          new THREE.Vector3((Math.random() - 0.5) * 3, Math.random() * 2, Math.random() * 3),
          0.3,
          0.8
        );
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLane(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') moveLane(1);
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        jump();
      }
      if (e.code === 'KeyR' && gameOver) restart();
    });

    let touchStart = null;

    renderer.domElement.addEventListener('pointerdown', (e) => {
      initAudio();
      touchStart = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!touchStart) return;
      const dx = e.clientX - touchStart.x;
      const dy = e.clientY - touchStart.y;
      touchStart = null;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) moveLane(1);
        else if (dx < -30) moveLane(-1);
      } else if (dy < -30) {
        jump();
      }
    });

    // ---------- Neustart ----------
    function restart() {
      for (const obj of objects) scene.remove(obj);
      objects.length = 0;

      for (const p of particles) scene.remove(p.mesh);
      particles.length = 0;

      for (const b of lightningBolts) scene.remove(b.line);
      lightningBolts.length = 0;

      laneIndex = 1;
      jumpY = 0;
      velocityY = 0;
      onGround = true;

      speed = minSpeed;
      peakSpeed = minSpeed;
      steps = 0;
      score = 0;
      combo = 1;
      lives = 3;
      gameOver = false;

      walkCycle = 0;
      shakeIntensity = 0;
      waveTimer = 0.4;

      player.position.set(0, 0, 0);
      characterRig.rotation.set(0, 0, 0);
      camera.position.copy(baseCameraPos);
      camera.fov = 70;
      camera.updateProjectionMatrix();

      ui.gameover.classList.add('hidden');
      updateUI();
    }

    document.getElementById('restartBtn').addEventListener('click', restart);

    function endGame() {
      gameOver = true;
      ui.finalScore.textContent = Math.floor(score);
      ui.finalMaxSpeed.textContent = peakSpeed.toFixed(1);
      ui.finalSteps.textContent = steps;
      ui.gameover.classList.remove('hidden');
    }

    // ---------- Geh- & Laufanimation ----------
    function updateCharacterAnimation(dt, deltaX) {
      // Neigung beim Spurwechsel (Banking)
      const targetBank = -deltaX * 0.25;
      characterRig.rotation.z += (targetBank - characterRig.rotation.z) * Math.min(1, 14 * dt);

      if (onGround) {
        // Schrittfrequenz steigt mit der Geschwindigkeit
        const strideFreq = 7 + speed * 0.42;
        walkCycle += strideFreq * dt;

        const swingAngle = Math.min(1.15, 0.55 + speed * 0.012);
        const legSwing = Math.sin(walkCycle) * swingAngle;
        const armSwing = Math.sin(walkCycle) * (swingAngle * 0.9);

        leftLeg.rotation.x = legSwing;
        rightLeg.rotation.x = -legSwing;

        // Gegengleiches Armschwingen + leichtes Abspreizen bei hohem Tempo
        leftArm.rotation.x = -armSwing;
        rightArm.rotation.x = armSwing;
        leftArm.rotation.z = 0.08 + Math.min(0.25, speed * 0.003);
        rightArm.rotation.z = -0.08 - Math.min(0.25, speed * 0.003);

        // Leichtes Auf- und Abwippen des Körpers bei jedem Schritt
        const bounce = Math.abs(Math.cos(walkCycle)) * 0.11;
        characterRig.position.y = bounce;

        // Nach vorne lehnen je schneller man wird (Sprint-Haltung!)
        const forwardLean = Math.min(0.38, 0.06 + (speed - minSpeed) * 0.0045);
        characterRig.rotation.x = forwardLean;
        headGroup.rotation.x = -forwardLean * 0.7; // Kopf schaut weiter geradeaus
      } else {
        // Sprung-Pose: Beine anziehen, Arme nach oben reißen
        leftLeg.rotation.x += (0.55 - leftLeg.rotation.x) * Math.min(1, 12 * dt);
        rightLeg.rotation.x += (-0.45 - rightLeg.rotation.x) * Math.min(1, 12 * dt);
        leftArm.rotation.x += (-0.85 - leftArm.rotation.x) * Math.min(1, 12 * dt);
        rightArm.rotation.x += (-0.85 - rightArm.rotation.x) * Math.min(1, 12 * dt);
        characterRig.position.y = 0;
        characterRig.rotation.x = 0.15;
      }
    }

    // ---------- Geschwindigkeits-Effekte (Turbo, Feuer, Blitz, Overdrive) ----------
    function updateSpeedEffects(dt) {
      const tier = getSpeedTier(speed);

      // Farben von Spieler, Licht & Umgebung sanft an die Speed-Stufe anpassen
      bodyMat.color.lerp(new THREE.Color(tier.color), 5 * dt);
      bodyMat.emissive.lerp(new THREE.Color(tier.emissive), 5 * dt);
      visorMat.emissive.lerp(new THREE.Color(tier.color), 5 * dt);
      scene.fog.color.lerp(new THREE.Color(tier.fogColor), 3 * dt);
      scene.background.lerp(new THREE.Color(tier.fogColor), 3 * dt);

      for (const rail of rails) {
        rail.material.emissive.lerp(new THREE.Color(tier.color), 4 * dt);
      }
      pillarMat.emissive.lerp(new THREE.Color(tier.color), 4 * dt);
      stripeMat.color.lerp(new THREE.Color(tier.color), 4 * dt);

      // Aura-Ring & PointLight
      playerAuraLight.position.set(player.position.x, player.position.y + 1.2, 0);
      playerAuraLight.color.lerp(new THREE.Color(tier.color), 5 * dt);

      if (speed >= 20) {
        auraRing.material.opacity = Math.min(0.75, (speed - 20) * 0.02);
        auraRing.material.color.setHex(tier.color);
        auraRing.scale.setScalar(1 + Math.sin(performance.now() * 0.015) * 0.12);
        playerAuraLight.intensity = Math.min(4.5, (speed - 18) * 0.08);
      } else {
        auraRing.material.opacity = 0;
        playerAuraLight.intensity = 0;
      }

      // Dynamisches Kamera-FOV (Speed-Tunnel-Effekt)
      const targetFov = Math.min(104, 70 + (speed - minSpeed) * 0.32);
      camera.fov += (targetFov - camera.fov) * Math.min(1, 5 * dt);
      camera.updateProjectionMatrix();

      // Partikel & Blitze spawnen je nach Geschwindigkeit
      effectTimer -= dt;
      if (effectTimer <= 0) {
        if (speed >= 110) {
          // Kosmischer Overdrive: Feuer + Regenbogen/Plasma + Blitze
          const colors = [0xf472b6, 0x22d3ee, 0xfacc15, 0xa855f7];
          const col = colors[Math.floor(Math.random() * colors.length)];
          spawnParticle(
            new THREE.Vector3(player.position.x + (Math.random() - 0.5) * 0.7, player.position.y + 0.2, 0.2),
            col,
            new THREE.Vector3((Math.random() - 0.5) * 3, 1.5 + Math.random() * 2.5, 6 + speed * 0.15),
            0.4,
            1.4
          );
          if (Math.random() < 0.75) spawnLightningAroundPlayer();
          effectTimer = 0.025;
        } else if (speed >= 70) {
          // Blitz-Modus: Elektrische Blitze + violette Funken
          spawnLightningAroundPlayer();
          spawnParticle(
            new THREE.Vector3(player.position.x + (Math.random() - 0.5) * 0.6, player.position.y + 0.3, 0.2),
            Math.random() < 0.5 ? 0xc084fc : 0x38bdf8,
            new THREE.Vector3((Math.random() - 0.5) * 2.5, 1 + Math.random() * 2, 5 + speed * 0.12),
            0.35,
            1.2
          );
          effectTimer = 0.04;
        } else if (speed >= 40) {
          // Feuer-Modus: Flammenschweif unter den Füßen & Rücken
          const fireColors = [0xf97316, 0xef4444, 0xfacc15];
          const fireCol = fireColors[Math.floor(Math.random() * fireColors.length)];
          spawnParticle(
            new THREE.Vector3(player.position.x + (Math.random() - 0.5) * 0.55, player.position.y + 0.15, 0.25),
            fireCol,
            new THREE.Vector3((Math.random() - 0.5) * 1.8, 1.2 + Math.random() * 2.2, 4 + speed * 0.1),
            0.42,
            1.25
          );
          effectTimer = 0.035;
        } else if (speed >= 20) {
          // Turbo-Aura: Blaue Energie-Spuren
          spawnParticle(
            new THREE.Vector3(player.position.x + (Math.random() - 0.5) * 0.45, player.position.y + 0.15, 0.2),
            0x38bdf8,
            new THREE.Vector3((Math.random() - 0.5) * 1.2, 0.6 + Math.random(), 3 + speed * 0.08),
            0.35,
            0.9
          );
          effectTimer = 0.055;
        }
      }
    }

    // ---------- Update ----------
    function update(dt) {
      // Spur weich wechseln
      const targetX = lanes[laneIndex];
      const deltaX = targetX - player.position.x;
      player.position.x += deltaX * Math.min(1, 14 * dt);

      // Sprungphysik
      if (!onGround) {
        velocityY -= 22 * dt;
        jumpY += velocityY * dt;
        if (jumpY <= 0) {
          jumpY = 0;
          velocityY = 0;
          onGround = true;
        }
      }
      player.position.y = jumpY;

      // Geh-Animation & Speed-Effekte aktualisieren
      updateCharacterAnimation(dt, deltaX);
      updateSpeedEffects(dt);

      // Welt bewegt sich auf Spieler zu
      const dz = speed * dt;

      // Bodenstreifen & Seitenpfeiler bewegen für Geschwindigkeitsgefühl
      for (const stripe of roadStripes) {
        stripe.position.z += dz;
        if (stripe.position.z > 15) stripe.position.z -= 140;
      }
      for (const pillar of sidePillars) {
        pillar.position.z += dz;
        if (pillar.position.z > 15) pillar.position.z -= 140;
      }

      // Objekte (Ringe & Hindernisse) bewegen
      for (let i = objects.length - 1; i >= 0; i--) {
        const obj = objects[i];
        obj.position.z += dz;

        if (obj.userData.type === 'step') {
          obj.rotation.z += 3.5 * dt; // Ringe drehen sich schön

          if (
            obj.userData.lane === laneIndex &&
            Math.abs(obj.position.z) < 1.3 &&
            !obj.userData.collected
          ) {
            obj.userData.collected = true;
            steps += 1;
            score += 10 * combo;
            combo = Math.min(combo + 1, 50);

            // Unendliche Geschwindigkeitssteigerung!
            speed += 0.35;
            if (speed > peakSpeed) peakSpeed = speed;

            playSound('step', combo);

            // Goldene Sammel-Explosion
            for (let p = 0; p < 10; p++) {
              spawnParticle(
                obj.position.clone(),
                0xfacc15,
                new THREE.Vector3((Math.random() - 0.5) * 6, Math.random() * 5, (Math.random() - 0.5) * 6),
                0.4,
                1.0
              );
            }

            scene.remove(obj);
            objects.splice(i, 1);
            continue;
          }
        }

        if (obj.userData.type === 'obstacle') {
          if (
            obj.userData.lane === laneIndex &&
            Math.abs(obj.position.z) < 1.25 &&
            !obj.userData.hit
          ) {
            const avoidedByJump = obj.userData.low && jumpY > 0.78;

            if (!avoidedByJump) {
              obj.userData.hit = true;
              lives -= 1;
              combo = 1;
              speed = Math.max(minSpeed, speed * 0.65);
              shakeIntensity = 0.45;
              playSound('hit');

              // Rote Treffer-Partikel
              for (let p = 0; p < 16; p++) {
                spawnParticle(
                  new THREE.Vector3(player.position.x, player.position.y + 1, 0),
                  0xef4444,
                  new THREE.Vector3((Math.random() - 0.5) * 8, Math.random() * 6, (Math.random() - 0.5) * 8),
                  0.5,
                  1.3
                );
              }

              scene.remove(obj);
              objects.splice(i, 1);

              if (lives <= 0) {
                endGame();
                return;
              }
              continue;
            }
          }
        }

        if (obj.position.z > 14) {
          scene.remove(obj);
          objects.splice(i, 1);
        }
      }

      // Partikel updaten
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.mesh.position.addScaledVector(p.vel, dt);
        p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
        p.mesh.scale.multiplyScalar(0.96);

        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }

      // Blitze updaten
      for (let i = lightningBolts.length - 1; i >= 0; i--) {
        const b = lightningBolts[i];
        b.life -= dt;
        b.line.material.opacity = Math.max(0, b.life / 0.12);
        if (b.life <= 0) {
          scene.remove(b.line);
          b.line.geometry.dispose();
          lightningBolts.splice(i, 1);
        }
      }

      // Kamera-Wackeln (Screen Shake bei Crash + leichtes Vibrieren bei extremem Tempo)
      let camOffsetX = 0;
      let camOffsetY = 0;
      if (shakeIntensity > 0) {
        camOffsetX += (Math.random() - 0.5) * shakeIntensity;
        camOffsetY += (Math.random() - 0.5) * shakeIntensity;
        shakeIntensity = Math.max(0, shakeIntensity - 1.8 * dt);
      }
      if (speed >= 40) {
        const speedJitter = Math.min(0.08, (speed - 40) * 0.0008);
        camOffsetX += (Math.random() - 0.5) * speedJitter;
        camOffsetY += (Math.random() - 0.5) * speedJitter;
      }
      camera.position.set(baseCameraPos.x + camOffsetX, baseCameraPos.y + camOffsetY, baseCameraPos.z);

      // Passiver Score & minimale kontinuierliche Beschleunigung
      score += speed * dt * 0.65;
      speed += 0.12 * dt; // Man wird auch passiv immer schneller!
      if (speed > peakSpeed) peakSpeed = speed;

      // Wellen-Spawn-Timer (Abstand bleibt durch speed-Skalierung auch bei Speed 200+ fair!)
      waveTimer -= dt;
      if (waveTimer <= 0) {
        spawnWave();
        // Abstand in Metern bleibt konstant genug zum Reagieren (~16 bis 22 Einheiten)
        const distanceBetweenWaves = Math.max(15, 22 - speed * 0.04);
        waveTimer = distanceBetweenWaves / speed;
      }

      updateUI();
    }

    // ---------- Loop ----------
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (!gameOver) update(dt);

      renderer.render(scene, camera);
    }

    updateUI();
    requestAnimationFrame(animate);

    // ---------- Resize ----------
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>

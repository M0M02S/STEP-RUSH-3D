<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Step Rush 3D – Open World</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: white;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; touch-action: none; }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,.6);
    }
    .card {
      background: rgba(15, 23, 42, .65);
      border: 1px solid rgba(96, 165, 250, .35);
      border-radius: 12px;
      padding: 8px 14px;
      backdrop-filter: blur(8px);
      min-width: 86px;
    }
    .label {
      display: block;
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #93c5fd;
      margin-bottom: 2px;
    }
    .value {
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, .6);
      border: 1px solid rgba(96, 165, 250, .3);
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 12px;
      color: #cbd5e1;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(8px);
      max-width: 92vw;
    }
    @media (min-width: 700px) {
      #hint { font-size: 13px; }
    }

    #sprintBar {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: min(60vw, 280px);
      height: 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .75);
      border: 1px solid rgba(96, 165, 250, .4);
      overflow: hidden;
      pointer-events: none;
    }
    #sprintFill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #22d3ee, #a855f7);
      transition: width .08s linear;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="card"><span class="label">Speed</span><span class="value" id="speed">0.0</span></div>
    <div class="card"><span class="label">Schritte</span><span class="value" id="steps">0</span></div>
    <div class="card"><span class="label">Orbs</span><span class="value" id="orbs">0</span></div>
    <div class="card"><span class="label">Position</span><span class="value" id="pos">0,0</span></div>
  </div>

  <div id="sprintBar"><div id="sprintFill"></div></div>
  <div id="hint">WASD = bewegen · Shift = sprinten · Maus = Kamera · Space = springen · Mobil: linke Hälfte Joystick, rechte Kamera</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ==========================================================
    //  SETUP
    // ==========================================================
    const scene = new THREE.Scene();
    const SKY_COLOR = 0x9ec9ea;
    const FOG_COLOR = 0xa8d0e8;
    scene.background = new THREE.Color(SKY_COLOR);
    scene.fog = new THREE.Fog(FOG_COLOR, 120, 520);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 3000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // ---------- Lights ----------
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));

    const sun = new THREE.DirectionalLight(0xfff2d0, 1.35);
    sun.position.set(80, 150, 80);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 400;
    sun.shadow.camera.left = -50;
    sun.shadow.camera.right = 50;
    sun.shadow.camera.top = 50;
    sun.shadow.camera.bottom = -50;
    sun.shadow.bias = -0.0006;
    sun.shadow.normalBias = 0.02;
    scene.add(sun);
    scene.add(sun.target);

    const hemi = new THREE.HemisphereLight(SKY_COLOR, 0x4a6b3a, 0.55);
    scene.add(hemi);

    // ---------- Sky dome ----------
    const skyGeo = new THREE.SphereGeometry(1600, 32, 16);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {
        topColor:    { value: new THREE.Color(0x4a90d9) },
        bottomColor: { value: new THREE.Color(0xd7ecff) },
        offset:      { value: 200 },
        exponent:    { value: 0.7 }
      },
      vertexShader: `
        varying vec3 vWorld;
        void main() {
          vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 bottomColor;
        uniform float offset;
        uniform float exponent;
        varying vec3 vWorld;
        void main() {
          float h = normalize(vWorld + offset).y;
          gl_FragColor = vec4(mix(bottomColor, topColor, pow(max(h, 0.0), exponent)), 1.0);
        }
      `
    });
    const skyDome = new THREE.Mesh(skyGeo, skyMat);
    scene.add(skyDome);

    // ==========================================================
    //  TERRAIN  (large open world with procedural noise)
    // ==========================================================
    const TERRAIN_SIZE = 4000;
    const TERRAIN_SEG  = 260;

    function hash2(x, y) {
      const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return s - Math.floor(s);
    }
    function noise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const u = fx * fx * (3 - 2 * fx);
      const v = fy * fy * (3 - 2 * fy);
      const a = hash2(ix, iy);
      const b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1);
      const d = hash2(ix + 1, iy + 1);
      return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
    }
    function fbm(x, y, oct = 4) {
      let v = 0, amp = 1, freq = 1, max = 0;
      for (let i = 0; i < oct; i++) {
        v += noise2(x * freq, y * freq) * amp;
        max += amp;
        amp *= 0.5;
        freq *= 2;
      }
      return v / max;
    }
    function terrainHeight(x, z) {
      let h = fbm(x * 0.0022, z * 0.0022, 5) * 70 - 26;
      h += fbm(x * 0.010, z * 0.010, 3) * 5;
      return h;
    }

    // Terrain mesh
    const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
    terrainGeo.rotateX(-Math.PI / 2);

    const posAttr = terrainGeo.attributes.position;
    const colors = new Float32Array(posAttr.count * 3);
    const tmpColor = new THREE.Color();

    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const z = posAttr.getZ(i);
      const y = terrainHeight(x, z);
      posAttr.setY(i, y);

      // Height-based vertex colours
      if (y < -8) {
        tmpColor.setHex(0x3f6b39);              // deep valley – dark grass
      } else if (y < 8) {
        const t = (y + 8) / 16;
        tmpColor.setRGB(
          0.32 + t * 0.04,
          0.52 - t * 0.08,
          0.28 - t * 0.02
        );
      } else if (y < 24) {
        tmpColor.setHex(0x776b52);              // dirt / hillside
      } else {
        tmpColor.setHex(0x9b9b9b);              // rock
      }
      const v = (hash2(x * 0.6, z * 0.6) - 0.5) * 0.08;
      colors[i * 3]     = Math.max(0, tmpColor.r + v);
      colors[i * 3 + 1] = Math.max(0, tmpColor.g + v);
      colors[i * 3 + 2] = Math.max(0, tmpColor.b + v);
    }

    terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.95,
      metalness: 0.0
    });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    // ==========================================================
    //  SCENERY  (instanced trees, rocks, orbs)
    // ==========================================================
    const dummy = new THREE.Object3D();

    // --- Trees ---
    const NUM_TREES = 520;
    const trunkGeo = new THREE.CylinderGeometry(0.18, 0.26, 3.0, 6);
    const leavesGeo = new THREE.ConeGeometry(1.6, 4.2, 8);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 0.95 });
    const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2c6b3f, roughness: 0.85 });

    const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, NUM_TREES);
    const leaves = new THREE.InstancedMesh(leavesGeo, leavesMat, NUM_TREES);
    trunks.castShadow = true;
    leaves.castShadow = true;
    trunks.receiveShadow = true;
    leaves.receiveShadow = true;

    for (let i = 0; i < NUM_TREES; i++) {
      const x = (Math.random() - 0.5) * (TERRAIN_SIZE - 120);
      const z = (Math.random() - 0.5) * (TERRAIN_SIZE - 120);
      // avoid spawning on the very center start point
      if (Math.abs(x) < 8 && Math.abs(z) < 8) { dummy.position.set(0, -100, 0); }
      const y = terrainHeight(x, z);
      const s = 0.65 + Math.random() * 0.9;

      dummy.position.set(x, y + 1.5 * s, z);
      dummy.rotation.set(0, Math.random() * Math.PI * 2, 0);
      dummy.scale.setScalar(s);
      dummy.updateMatrix();
      trunks.setMatrixAt(i, dummy.matrix);

      dummy.position.set(x, y + 3.0 * s + 2.1 * s, z);
      dummy.updateMatrix();
      leaves.setMatrixAt(i, dummy.matrix);
    }
    scene.add(trunks);
    scene.add(leaves);

    // --- Rocks ---
    const NUM_ROCKS = 320;
    const rockGeo = new THREE.DodecahedronGeometry(1, 0);
    const rockMat = new THREE.MeshStandardMaterial({
      color: 0x777777, roughness: 0.95, flatShading: true
    });
    const rocks = new THREE.InstancedMesh(rockGeo, rockMat, NUM_ROCKS);
    rocks.castShadow = true;
    rocks.receiveShadow = true;

    for (let i = 0; i < NUM_ROCKS; i++) {
      const x = (Math.random() - 0.5) * (TERRAIN_SIZE - 120);
      const z = (Math.random() - 0.5) * (TERRAIN_SIZE - 120);
      const y = terrainHeight(x, z);
      const s = 0.5 + Math.random() * 2.2;
      dummy.position.set(x, y + s * 0.35, z);
      dummy.rotation.set(Math.random() * 0.6, Math.random() * Math.PI * 2, Math.random() * 0.6);
      dummy.scale.set(s, s * (0.6 + Math.random() * 0.5), s);
      dummy.updateMatrix();
      rocks.setMatrixAt(i, dummy.matrix);
    }
    scene.add(rocks);

    // --- Collectible orbs ---
    const orbGroup = new THREE.Group();
    scene.add(orbGroup);

    const orbGeo = new THREE.OctahedronGeometry(0.5, 0);
    const orbMat = new THREE.MeshStandardMaterial({
      color: 0xffd54f,
      emissive: 0xffb300,
      emissiveIntensity: 1.1,
      roughness: 0.3,
      metalness: 0.4
    });
    const orbs = [];

    function spawnOrb(x, z) {
      const y = terrainHeight(x, z) + 1.2;
      const orb = new THREE.Mesh(orbGeo, orbMat);
      orb.position.set(x, y, z);
      orb.castShadow = true;
      orb.userData.baseY = y;
      orb.userData.phase = Math.random() * Math.PI * 2;
      orbGroup.add(orb);
      orbs.push(orb);
    }

    for (let i = 0; i < 280; i++) {
      let x, z;
      do {
        x = (Math.random() - 0.5) * 1800;
        z = (Math.random() - 0.5) * 1800;
      } while (Math.abs(x) < 4 && Math.abs(z) < 4);
      spawnOrb(x, z);
    }

    // ==========================================================
    //  CHARACTER RIG
    // ==========================================================
    const skinMat  = new THREE.MeshStandardMaterial({ color: 0xf0c4a0, roughness: 0.85 });
    const shirtMat = new THREE.MeshStandardMaterial({ color: 0x1e88e5, roughness: 0.7 });
    const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2b3a4a, roughness: 0.85 });
    const shoeMat  = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });
    const hairMat  = new THREE.MeshStandardMaterial({ color: 0x2e1d12, roughness: 0.9 });
    const eyeMat   = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4 });

    const player = new THREE.Group();
    scene.add(player);

    // Root group that receives vertical bob
    const hips = new THREE.Group();
    hips.position.y = 0.9;
    player.add(hips);

    // Pelvis
    const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.20, 0.22), pantsMat);
    pelvis.position.y = -0.04;
    pelvis.castShadow = true;
    hips.add(pelvis);

    // Chest group (bobs, leans, counter-rotates)
    const chest = new THREE.Group();
    chest.position.y = 0.10;
    hips.add(chest);

    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.30, 6, 14), shirtMat);
    torso.position.y = 0.20;
    torso.castShadow = true;
    chest.add(torso);

    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.09, 8), skinMat);
    neck.position.y = 0.42;
    chest.add(neck);

    // Head
    const headGroup = new THREE.Group();
    headGroup.position.y = 0.56;
    chest.add(headGroup);

    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.145, 22, 22), skinMat);
    skull.castShadow = true;
    headGroup.add(skull);

    const hair = new THREE.Mesh(
      new THREE.SphereGeometry(0.152, 20, 20, 0, Math.PI * 2, 0, Math.PI * 0.62),
      hairMat
    );
    hair.position.y = 0.01;
    headGroup.add(hair);

    // Eyes (facing -Z = forward)
    for (const s of [-1, 1]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.021, 8, 8), eyeMat);
      eye.position.set(s * 0.05, 0.015, -0.135);
      headGroup.add(eye);
    }

    // ----- Helper: capsule limb -----
    function limbGeo(radius, totalLength) {
      const cyl = Math.max(0.001, totalLength - 2 * radius);
      return new THREE.CapsuleGeometry(radius, cyl, 6, 10);
    }

    // ----- Arms -----
    function createArm(side) {
      const shoulder = new THREE.Group();
      shoulder.position.set(side * 0.21, 0.30, 0);
      chest.add(shoulder);

      const upperArm = new THREE.Mesh(limbGeo(0.057, 0.28), shirtMat);
      upperArm.position.y = -0.14;
      upperArm.castShadow = true;
      shoulder.add(upperArm);

      const elbow = new THREE.Group();
      elbow.position.y = -0.28;
      shoulder.add(elbow);

      const forearm = new THREE.Mesh(limbGeo(0.05, 0.26), skinMat);
      forearm.position.y = -0.13;
      forearm.castShadow = true;
      elbow.add(forearm);

      const hand = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), skinMat);
      hand.position.y = -0.28;
      hand.castShadow = true;
      elbow.add(hand);

      return { shoulder, elbow, hand };
    }
    const leftArm  = createArm(-1);
    const rightArm = createArm( 1);

    // ----- Legs -----
    function createLeg(side) {
      const hip = new THREE.Group();
      hip.position.set(side * 0.095, 0, 0);
      hips.add(hip);

      const upper = new THREE.Mesh(limbGeo(0.08, 0.42), pantsMat);
      upper.position.y = -0.21;
      upper.castShadow = true;
      hip.add(upper);

      const knee = new THREE.Group();
      knee.position.y = -0.42;
      hip.add(knee);

      const lower = new THREE.Mesh(limbGeo(0.068, 0.40), pantsMat);
      lower.position.y = -0.20;
      lower.castShadow = true;
      knee.add(lower);

      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.08, 0.26), shoeMat);
      foot.position.set(0, -0.42, -0.05);
      foot.castShadow = true;
      knee.add(foot);

      return { hip, knee, foot };
    }
    const leftLeg  = createLeg(-1);
    const rightLeg = createLeg( 1);

    // ==========================================================
    //  STATE
    // ==========================================================
    const playerPos = new THREE.Vector3(0, 0, 0);
    playerPos.y = terrainHeight(0, 0);

    let playerAngle =

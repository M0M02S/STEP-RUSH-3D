<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
<title>Step Rush 3D - Neon Edition</title>
<style>
  :root {
    --primary: #00f3ff;
    --secondary: #ff00ea;
    --accent: #ffd500;
    --bg-dark: #050510;
    --glass: rgba(10, 15, 30, 0.7);
    --glass-border: rgba(0, 243, 255, 0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-dark); color: #fff;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  canvas { display: block; }

  /* ---- Start Menü ---- */
  #menu {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #1a0b2e 0%, var(--bg-dark) 100%);
    padding: 20px; text-align: center;
    transition: opacity 0.5s ease;
  }
  #menu::before {
    content: ''; position: absolute; inset: 0;
    background: 
      linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    perspective: 500px; transform: rotateX(60deg) translateY(-200px);
    pointer-events: none;
    z-index: -1;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove {
    0% { transform: rotateX(60deg) translateY(0); }
    100% { transform: rotateX(60deg) translateY(40px); }
  }

  #menu h1 {
    font-size: clamp(40px, 8vw, 80px); font-weight: 900;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-transform: uppercase; letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    margin-bottom: 10px;
    animation: pulseTitle 3s infinite alternate;
  }
  @keyframes pulseTitle {
    from { filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.4)); }
    to { filter: drop-shadow(0 0 30px rgba(255, 0, 234, 0.6)); }
  }
  #menu .subtitle { color: #a0aec0; font-size: 18px; margin-bottom: 50px; letter-spacing: 2px; }
  
  .mode-buttons { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
  .mode-btn {
    background: var(--glass);
    border: 2px solid var(--glass-border);
    border-radius: 20px; padding: 30px 40px; min-width: 240px;
    cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    color: #fff; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
  }
  .mode-btn:hover {
    border-color: var(--primary);
    background: rgba(0, 243, 255, 0.1);
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 0 40px rgba(0, 243, 255, 0.4);
  }
  .mode-btn .icon { font-size: 50px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
  .mode-btn .title { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .mode-btn .desc { font-size: 14px; color: var(--primary); }

  /* ---- HUD ---- */
  #hud {
    position: fixed; top: 20px; left: 20px; right: 20px;
    display: none; gap: 15px; flex-wrap: wrap;
    pointer-events: none; z-index: 10;
    justify-content: space-between;
  }
  .hud-left { display: flex; gap: 15px; flex-wrap: wrap; }
  .hud-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px; padding: 12px 20px; min-width: 100px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; justify-content: center;
  }
  .hud-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--primary); margin-bottom: 4px; font-weight: 700; }
  .hud-value { font-size: 26px; font-weight: 900; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
  
  .hud-boost-bar {
    width: 200px; height: 8px; background: rgba(255,255,255,0.1);
    border-radius: 10px; margin-top: 8px; overflow: hidden;
  }
  .hud-boost-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary));
    border-radius: 10px; transition: width 0.1s;
    box-shadow: 0 0 10px var(--secondary);
  }

  /* ---- Speed Lines Overlay ---- */
  #speedLines {
    position: fixed; inset: 0; pointer-events: none; z-index: 8;
    opacity: 0; transition: opacity 0.3s;
    background: radial-gradient(circle, transparent 40%, rgba(0, 243, 255, 0.15) 100%);
    box-shadow: inset 0 0 100px rgba(0, 243, 255, 0.3);
  }

  /* ---- Hinweis ---- */
  #hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 20px; padding: 12px 24px;
    font-size: 14px; color: #fff; text-align: center;
    pointer-events: none; backdrop-filter: blur(10px);
    z-index: 10; max-width: 90vw; letter-spacing: 1px;
    transition: opacity 1s; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  /* ---- Mobile Controls ---- */
  #mobileControls { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #mobileControls.hidden { display: none; }

  #joystick {
    position: absolute; bottom: 40px; left: 40px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(10, 15, 30, 0.5);
    border: 2px solid var(--glass-border);
    pointer-events: auto; touch-action: none;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    backdrop-filter: blur(5px);
  }
  #joyKnob {
    position: absolute; top: 50%; left: 50%;
    width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, var(--primary));
    border: 2px solid #fff;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow: 0 0 20px var(--primary);
  }

  .action-btn {
    position: absolute; border-radius: 50%;
    background: var(--glass); border: 2px solid var(--glass-border);
    color: #fff; font-weight: 900; font-size: 16px; letter-spacing: 1px;
    pointer-events: auto; touch-action: none;
    display: flex; align-items: center; justify-content: center;
    user-select: none; backdrop-filter: blur(5px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transition: transform 0.1s, background 0.1s;
  }
  .action-btn:active { transform: scale(0.9); background: rgba(0, 243, 255, 0.3); border-color: var(--primary); }
  
  #btnSprint { bottom: 50px; right: 40px; width: 100px; height: 100px; border-color: var(--accent); box-shadow: 0 0 20px rgba(255, 213, 0, 0.2); }
  #btnSprint:active { background: rgba(255, 213, 0, 0.3); border-color: var(--accent); }
  #btnJump { bottom: 170px; right: 60px; width: 80px; height: 80px; font-size: 28px; border-color: var(--primary); }

</style>
</head>
<body>

  <div id="menu">
    <h1>Step Rush 3D</h1>
    <p class="subtitle">WÄHLE DEIN SETUP</p>
    <div class="mode-buttons">
      <button class="mode-btn" id="btnDesktop">
        <span class="icon">🖥️</span>
        <span class="title">DESKTOP</span>
        <span class="desc">Maus & Tastatur</span>
      </button>
      <button class="mode-btn" id="btnMobile">
        <span class="icon">📱</span>
        <span class="title">MOBILE</span>
        <span class="desc">Touch-Steuerung</span>
      </button>
    </div>
  </div>

  <div id="speedLines"></div>

  <div id="hud">
    <div class="hud-left">
      <div class="hud-card">
        <span class="hud-label">Schritte</span>
        <span class="hud-value" id="hudSteps">0</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Orbs</span>
        <span class="hud-value" id="hudOrbs">0</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Speed</span>
        <span class="hud-value" id="hudSpeed">0.0</span>
        <div class="hud-boost-bar"><div class="hud-boost-fill" id="hudBoostFill"></div></div>
      </div>
    </div>
  </div>

  <div id="hint"></div>

  <div id="mobileControls" class="hidden">
    <div id="joystick"><div id="joyKnob"></div></div>
    <div class="action-btn" id="btnSprint">SPRINT</div>
    <div class="action-btn" id="btnJump">↑</div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ============================================================
    // SETUP & RENDERER
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.FogExp2(0x050510, 0.0015);

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 3000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // ============================================================
    // LICHTER
    // ============================================================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0x00f3ff, 0x1a0b2e, 0.8);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xffd500, 1.5);
    sun.position.set(100, 150, 50);
    sun.castShadow = true;
    // Schatten-Fix: Verhindert die "Aura" / Glitches um den Spieler
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 400;
    sun.shadow.camera.left = -100;
    sun.shadow.camera.right = 100;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 0.05;
    scene.add(sun);
    scene.add(sun.target);

    const fillLight = new THREE.DirectionalLight(0xff00ea, 0.6);
    fillLight.position.set(-100, 50, -100);
    scene.add(fillLight);

    // ============================================================
    // TERRAIN (NEON GRID MAP)
    // ============================================================
    function hash(x, y) {
      const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return s - Math.floor(s);
    }
    function noise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const u = fx * fx * (3 - 2 * fx);
      const v = fy * fy * (3 - 2 * fy);
      const a = hash(ix, iy), b = hash(ix + 1, iy);
      const c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
      return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
    }
    function fbm(x, y, oct) {
      let v = 0, amp = 1, freq = 1, max = 0;
      for (let i = 0; i < oct; i++) {
        v += noise(x * freq, y * freq) * amp;
        max += amp; amp *= 0.5; freq *= 2;
      }
      return v / max;
    }
    function terrainHeight(x, z) {
      let h = fbm(x * 0.0015, z * 0.0015, 5) * 80 - 30;
      h += fbm(x * 0.008, z * 0.008, 3) * 5;
      const r = Math.sqrt(x * x + z * z);
      if (r < 40) { const t = r / 40; h = h * t * t; } // Flach halten am Start
      return h;
    }

    const TERRAIN_SIZE = 5000, TERRAIN_SEG = 250;
    const tGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
    tGeo.rotateX(-Math.PI / 2);

    const pos = tGeo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const col = new THREE.Color();

    // Stylische Farben für das Terrain
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      const y = terrainHeight(x, z);
      pos.setY(i, y);

      // Tiefes Wasser -> Dunkelblau
      if (y < -15) col.setHex(0x0a1a3a);
      // Strand -> Sand
      else if (y < -5) col.setHex(0x2a3a5a);
      // Gras -> Neon Grün/Blau Mix
      else if (y < 15) col.setHex(0x0a2a1a);
      // Berge -> Lila/Fels
      else if (y < 35) col.setHex(0x2a0a3a);
      // Schnee -> Hellblau
      else col.setHex(0x5a7a9a);

      colors[i * 3] = col.r;
      colors[i * 3 + 1] = col.g;
      colors[i * 3 + 2] = col.b;
    }
    tGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    tGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.8, metalness: 0.2,
      wireframe: false
    });
    const terrain = new THREE.Mesh(tGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    // Neon Grid über das Terrain legen
    const gridHelper = new THREE.GridHelper(TERRAIN_SIZE, 100, 0x00f3ff, 0x00f3ff);
    gridHelper.position.y = 1;
    gridHelper.material.opacity = 0.15;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // Wasser Plane
    const waterGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE);
    const waterMat = new THREE.MeshStandardMaterial({
      color: 0x001122, transparent: true, opacity: 0.85,
      roughness: 0.1, metalness: 0.9, emissive: 0x002244, emissiveIntensity: 0.5
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.y = -15;
    scene.add(water);

    // ============================================================
    // UMGEBUNG (Bäume, Felsen, schwebende Inseln)
    // ============================================================
    const dummy = new THREE.Object3D();

    // Bäume (Instanced)
    const NUM_TREES = 800;
    const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 4, 6);
    const leavesGeo = new THREE.ConeGeometry(2.5, 6, 8);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x1a0b2e, roughness: 0.9 });
    const leavesMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x003344, roughness: 0.6, transparent: true, opacity: 0.9 });

    const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, NUM_TREES);
    const leaves = new THREE.InstancedMesh(leavesGeo, leavesMat, NUM_TREES);
    trunks.castShadow = leaves.castShadow = true;
    trunks.receiveShadow = leaves.receiveShadow = true;

    for (let i = 0; i < NUM_TREES; i++) {
      let x, z, y;
      do {
        x = (Math.random() - 0.5) * (TERRAIN_SIZE - 300);
        z = (Math.random() - 0.5) * (TERRAIN_SIZE - 300);
        y = terrainHeight(x, z);
      } while (y < -10 || (Math.abs(x) < 15 && Math.abs(z) < 15));

      const s = 0.8 + Math.random() * 1.2;
      
      dummy.position.set(x, y + 2 * s, z);
      dummy.rotation.set(0, Math.random() * Math.PI * 2, 0);
      dummy.scale.setScalar(s);
      dummy.updateMatrix();
      trunks.setMatrixAt(i, dummy.matrix);

      dummy.position.set(x, y + 7 * s, z);
      dummy.updateMatrix();
      leaves.setMatrixAt(i, dummy.matrix);
    }
    scene.add(trunks, leaves);

    // Schwebende Inseln
    const floatIslands = new THREE.Group();
    const islandMat = new THREE.MeshStandardMaterial({ color: 0x2a0a3a, roughness: 0.9, emissive: 0x110022, emissiveIntensity: 0.5 });
    for (let i = 0; i < 15; i++) {
      const size = 10 + Math.random() * 30;
      const island = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 1), islandMat);
      island.position.set(
        (Math.random() - 0.5) * 2500,
        100 + Math.random() * 150,
        (Math.random() - 0.5) * 2500
      );
      island.scale.y = 0.3;
      island.rotation.set(Math.random(), Math.random(), Math.random());
      island.castShadow = true;
      island.receiveShadow = true;
      
      // Kristall oben drauf
      const crystal = new THREE.Mesh(
        new THREE.OctahedronGeometry(size * 0.4, 0),
        new THREE.MeshStandardMaterial({ color: 0xff00ea, emissive: 0xff00ea, emissiveIntensity: 1 })
      );
      crystal.position.y = size * 0.5;
      island.add(crystal);
      
      island.userData.baseY = island.position.y;
      island.userData.speed = 0.5 + Math.random();
      island.userData.offset = Math.random() * Math.PI * 2;
      floatIslands.add(island);
    }
    scene.add(floatIslands);

    // ============================================================
    // ORBS (Sammelobjekte)
    // ============================================================
    const orbs = [];
    const ORB_COUNT = 150;
    const orbGeo = new THREE.IcosahedronGeometry(0.6, 0);
    const orbMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, emissive: 0xffd500, emissiveIntensity: 2,
      roughness: 0.2, metalness: 0.8
    });

    function spawnOrbAt(x, z) {
      const y = terrainHeight(x, z) + 1.5;
      const orb = new THREE.Mesh(orbGeo, orbMat);
      orb.position.set(x, y, z);
      orb.castShadow = true;
      orb.userData.baseY = y;
      orb.userData.phase = Math.random() * Math.PI * 2;
      
      // Orb-Halo
      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(0.8, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xffd500, transparent: true, opacity: 0.3, wireframe: true })
      );
      orb.add(halo);

      scene.add(orb);
      orbs.push(orb);
    }

    for (let i = 0; i < ORB_COUNT; i++) {
      let x, z;
      do {
        x = (Math.random() - 0.5) * 2500;
        z = (Math.random() - 0.5) * 2500;
      } while (Math.abs(x) < 15 && Math.abs(z) < 15);
      spawnOrbAt(x, z);
    }

    // ============================================================
    // CHARACTER RIG (Spieler)
    // ============================================================
    const matSkin  = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.8 });
    const matShirt = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.5, metalness: 0.5 });
    const matPants = new THREE.MeshStandardMaterial({ color: 0x0f0f1a, roughness: 0.7 });
    const matShoe  = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 0.8 });
    const matHair  = new THREE.MeshStandardMaterial({ color: 0x2e1d12, roughness: 0.9 });
    const matVisor = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xff00ea, emissiveIntensity: 1.5 });

    const player = new THREE.Group();
    scene.add(player);

    const hips = new THREE.Group();
    hips.position.y = 0.9;
    player.add(hips);

    function part(parent, geo, mat, x, y, z) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      parent.add(m);
      return m;
    }

    // Torso
    part(hips, new THREE.BoxGeometry(0.35, 0.2, 0.22), matPants, 0, -0.05, 0);
    const chest = new THREE.Group();
    chest.position.y = 0.1;
    hips.add(chest);
    part(chest, new THREE.CapsuleGeometry(0.2, 0.35, 8, 16), matShirt, 0, 0.2, 0);
    
    // Kopf
    const headGroup = new THREE.Group();
    headGroup.position.y = 0.55;
    chest.add(headGroup);
    part(headGroup, new THREE.SphereGeometry(0.16, 24, 24), matSkin, 0, 0, 0);
    part(headGroup, new THREE.SphereGeometry(0.17, 20, 20, 0, Math.PI * 2, 0, Math.PI * 0.6), matHair, 0, 0.02, 0);
    part(headGroup, new THREE.BoxGeometry(0.22, 0.08, 0.05), matVisor, 0, 0.02, -0.15);

    // Arme & Beine (Limbs)
    function limbGeo(r, len) { return new THREE.CapsuleGeometry(r, Math.max(0.001, len - 2 * r), 6, 10); }

    function createArm(side) {
      const shoulder = new THREE.Group();
      shoulder.position.set(side * 0.24, 0.32, 0);
      chest.add(shoulder);
      part(shoulder, limbGeo(0.06, 0.3), matShirt, 0, -0.15, 0);
      const elbow = new THREE.Group();
      elbow.position.y = -0.3;
      shoulder.add(elbow);
      part(elbow, limbGeo(0.05, 0.28), matSkin, 0, -0.14, 0);
      part(elbow, new THREE.SphereGeometry(0.06, 8, 8), matSkin, 0, -0.28, 0);
      return { shoulder, elbow };
    }
    const leftArm = createArm(-1);
    const rightArm = createArm(1);

    function createLeg(side) {
      const hip = new THREE.Group();
      hip.position.set(side * 0.11, 0, 0);
      hips.add(hip);
      part(hip, limbGeo(0.09, 0.45), matPants, 0, -0.22, 0);
      const knee = new THREE.Group();
      knee.position.y = -0.45;
      hip.add(knee);
      part(knee, limbGeo(0.07, 0.42), matPants, 0, -0.21, 0);
      part(knee, new THREE.BoxGeometry(0.15, 0.1, 0.3), matShoe, 0, -0.45, -0.06);
      return { hip, knee };
    }
    const leftLeg = createLeg(-1);
    const rightLeg = createLeg(1);

    // ============================================================
    // PARTIKEL SYSTEM (Staub & Trail)
    // ============================================================
    const particles = [];
    const particleGeo = new THREE.PlaneGeometry(0.3, 0.3);
    const particleMat = new THREE.MeshBasicMaterial({ 
      color: 0x00f3ff, transparent: true, opacity: 0.8, 
      blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false 
    });

    function spawnDust(pos) {
      if (particles.length > 50) return;
      const p = new THREE.Mesh(particleGeo, particleMat.clone());
      p.position.copy(pos);
      p.position.y += 0.1;
      p.position.x += (Math.random() - 0.5) * 0.5;
      p.position.z += (Math.random() - 0.5) * 0.5;
      p.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      p.userData = { life: 1.0, velocity: new THREE.Vector3((Math.random()-0.5)*2, Math.random()*2+1, (Math.random()-0.5)*2) };
      scene.add(p);
      particles.push(p);
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.userData.life -= dt * 2;
        if (p.userData.life <= 0) {
          scene.remove(p);
          particles.splice(i, 1);
          continue;
        }
        p.material.opacity = p.userData.life;
        p.position.addScaledVector(p.userData.velocity, dt);
        p.scale.setScalar(p.userData.life);
        p.rotation.x += dt * 2;
        p.rotation.y += dt * 2;
      }
    }

    // ============================================================
    // GAME STATE
    // ============================================================
    let gameMode = null;
    let started = false;

    const playerPos = new THREE.Vector3(0, terrainHeight(0, 0), 0);
    let playerYaw = 0;
    let currentSpeed = 0;

    let cameraYaw = 0;
    let cameraPitch = 0.35;
    const cameraDist = 9;

    let walkPhase = 0;
    let jumpOffset = 0;
    let jumpVel = 0;
    let onGround = true;
    let jumpRequested = false;

    let stepAccumulator = 0;
    let steps = 0;
    let orbCount = 0;

    const keys = {};
    const joyVec = { x: 0, y: 0 };
    let mobileSprint = false;

    // ============================================================
    // UI LOGIK
    // ============================================================
    const ui = {
      menu: document.getElementById('menu'),
      hud: document.getElementById('hud'),
      hint: document.getElementById('hint'),
      mobileControls: document.getElementById('mobileControls'),
      steps: document.getElementById('hudSteps'),
      orbs: document.getElementById('hudOrbs'),
      speed: document.getElementById('hudSpeed'),
      boostFill: document.getElementById('hudBoostFill'),
      speedLines: document.getElementById('speedLines')
    };

    document.getElementById('btnDesktop').addEventListener('click', () => startGame('desktop'));
    document.getElementById('btnMobile').addEventListener('click', () => startGame('mobile'));

    function startGame(mode) {
      gameMode = mode;
      started = true;
      ui.menu.style.opacity = '0';
      setTimeout(() => ui.menu.style.display = 'none', 500);
      ui.hud.style.display = 'flex';

      if (mode === 'mobile') {
        ui.mobileControls.classList.remove('hidden');
        ui.hint.textContent = 'Links = Joystick · Rechts ziehen = Kamera · SPRINT = Schneller · ↑ = Springen';
      } else {
        ui.mobileControls.classList.add('hidden');
        ui.hint.textContent = 'WASD = Bewegen · Shift = Sprinten · Maus ziehen = Kamera · Space = Springen';
      }
      setTimeout(() => { ui.hint.style.opacity = '0'; }, 6000);
    }

    // ============================================================
    // INPUT (Desktop)
    // ============================================================
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && gameMode === 'desktop') {
        jumpRequested = true;
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    let mouseDown = false, lastMX = 0, lastMY = 0;

    renderer.domElement.addEventListener('pointerdown', e => {
      if (gameMode === 'desktop' && e.pointerType === 'mouse') {
        mouseDown = true; lastMX = e.clientX; lastMY = e.clientY;
      }
    });
    window.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') mouseDown = false; });
    window.addEventListener('pointermove', e => {
      if (gameMode !== 'desktop' || !mouseDown || e.pointerType !== 'mouse') return;
      const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
      lastMX = e.clientX; lastMY = e.clientY;
      cameraYaw -= dx * 0.005;
      cameraPitch = THREE.MathUtils.clamp(cameraPitch + dy * 0.005, -0.15, 1.1);
    });

    // ============================================================
    // INPUT (Mobile)
    // ============================================================
    const joyEl = document.getElementById('joystick');
    const joyKnob = document.getElementById('joyKnob');
    let joyActive = false;
    let joyCenter = { x: 0, y: 0 };
    const JOY_RADIUS = 55;

    function updateJoy(x, y) {
      let dx = x - joyCenter.x, dy = y - joyCenter.y;
      const d = Math.hypot(dx, dy);
      if (d > JOY_RADIUS) { dx = dx / d * JOY_RADIUS; dy = dy / d * JOY_RADIUS; }
      joyVec.x = dx / JOY_RADIUS;
      joyVec.y = dy / JOY_RADIUS;
      joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }

    joyEl.addEventListener('pointerdown', e => {
      if (gameMode !== 'mobile') return;
      joyActive = true;
      const r = joyEl.getBoundingClientRect();
      joyCenter.x = r.left + r.width / 2;
      joyCenter.y = r.top + r.height / 2;
      updateJoy(e.clientX, e.clientY);
      joyEl.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    joyEl.addEventListener('pointermove', e => {
      if (!joyActive) return;
      updateJoy(e.clientX, e.clientY);
      e.stopPropagation();
    });
    const endJoy = e => {
      joyActive = false; joyVec.x = 0; joyVec.y = 0;
      joyKnob.style.transform = 'translate(-50%, -50%)';
      if (e) e.stopPropagation();
    };
    joyEl.addEventListener('pointerup', endJoy);
    joyEl.addEventListener('pointercancel', endJoy);

    let camTouch = null;
    renderer.domElement.addEventListener('pointerdown', e => {
      if (gameMode !== 'mobile') return;
      if (e.pointerType === 'touch' && e.clientX > innerWidth * 0.4) {
        camTouch = { x: e.clientX, y: e.clientY, id: e.pointerId };
        renderer.domElement.setPointerCapture(e.pointerId);
      }
    });
    renderer.domElement.addEventListener('pointermove', e => {
      if (!camTouch || e.pointerId !== camTouch.id) return;
      const dx = e.clientX - camTouch.x, dy = e.clientY - camTouch.y;
      camTouch.x = e.clientX; camTouch.y = e.clientY;
      cameraYaw -= dx * 0.008;
      cameraPitch = THREE.MathUtils.clamp(cameraPitch + dy * 0.008, -0.15, 1.1);
    });
    const endCam = e => { if (camTouch && e.pointerId === camTouch.id) camTouch = null; };
    renderer.domElement.addEventListener('pointerup', endCam);
    renderer.domElement.addEventListener('pointercancel', endCam);

    const btnSprint = document.getElementById('btnSprint');
    const btnJump = document.getElementById('btnJump');

    btnSprint.addEventListener('pointerdown', e => { mobileSprint = true; e.stopPropagation(); });
    btnSprint.addEventListener('pointerup', e => { mobileSprint = false; e.stopPropagation(); });
    btnSprint.addEventListener('pointercancel', () => mobileSprint = false);
    btnJump.addEventListener('pointerdown', e => { jumpRequested = true; e.preventDefault(); e.stopPropagation(); });

    // ============================================================
    // UPDATE LOGIK (Game Loop)
    // ============================================================
    function update(dt) {
      // 1. Input
      let inputX = 0, inputZ = 0;
      if (gameMode === 'desktop') {
        if (keys.KeyW || keys.ArrowUp) inputZ -= 1;
        if (keys.KeyS || keys.ArrowDown) inputZ += 1;
        if (keys.KeyA || keys.ArrowLeft) inputX -= 1;
        if (keys.KeyD || keys.ArrowRight) inputX += 1;
      }
      if (gameMode === 'mobile') {
        inputX += joyVec.x;
        inputZ += joyVec.y;
      }

      const inLen = Math.hypot(inputX, inputZ);
      let nx = 0, nz = 0;
      if (inLen > 0.05) { nx = inputX / inLen; nz = inputZ / inLen; }

      // Kamera-relativ
      const sin = Math.sin(cameraYaw), cos = Math.cos(cameraYaw);
      const wx = nz * sin + nx * cos;
      const wz = nz * cos - nx * sin;

      const sprinting = gameMode === 'desktop'
        ? (keys.ShiftLeft || keys.ShiftRight)
        : mobileSprint;

      // 2. Speed & Movement
      const speedMult = 1 + (steps / 1000);
      const runSpeed = 7 * speedMult;
      const sprintSpeed = 14 * speedMult;

      const moving = inLen > 0.1;
      const targetSpeed = moving ? (sprinting ? sprintSpeed : runSpeed) : 0;
      currentSpeed = THREE.MathUtils.lerp(currentSpeed, targetSpeed, Math.min(1, dt * 8));

      if (currentSpeed > 0.05) {
        playerPos.x += wx * currentSpeed * dt;
        playerPos.z += wz * currentSpeed * dt;

        // Charakter Drehung
        const targetYaw = Math.atan2(-wx, -wz);
        let diff = targetYaw - playerYaw;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        playerYaw += diff * Math.min(1, dt * 10);

        // Schritte zählen
        stepAccumulator += currentSpeed * dt;
        while (stepAccumulator > 0.8) {
          stepAccumulator -= 0.8;
          steps++;
        }
      }

      // 3. Springen
      const groundY = terrainHeight(playerPos.x, playerPos.z);
      if (jumpRequested && onGround) { jumpVel = 8; onGround = false; }
      jumpRequested = false;

      if (!onGround) {
        jumpVel -= 25 * dt;
        jumpOffset += jumpVel * dt;
        if (jumpOffset <= 0) { jumpOffset = 0; jumpVel = 0; onGround = true; }
      }

      playerPos.y = groundY + jumpOffset;
      player.position.copy(playerPos);
      player.rotation.y = playerYaw;

      // 4. Animation & Effekte
      animateCharacter(dt, sprinting, moving);
      
      // Dust Partikel bei Bewegung
      if (currentSpeed > 3 && onGround && Math.random() < 0.5) {
        const footPos = player.position.clone();
        footPos.x += Math.sin(playerYaw) * 0.5;
        footPos.z += Math.cos(playerYaw) * 0.5;
        spawnDust(footPos);
      }
      updateParticles(dt);

      // Speed Lines UI
      if (sprinting && currentSpeed > 10) {
        ui.speedLines.style.opacity = '1';
      } else {
        ui.speedLines.style.opacity = '0';
      }

      // 5. Kamera
      const focusY = playerPos.y + 1.8;
      camera.position.set(
        playerPos.x + Math.sin(cameraYaw) * Math.cos(cameraPitch) * cameraDist,
        focusY + Math.sin(cameraPitch) * cameraDist,
        playerPos.z + Math.cos(cameraYaw) * Math.cos(cameraPitch) * cameraDist
      );
      camera.lookAt(playerPos.x, focusY, playerPos.z);

      // Sonne folgt Spieler (für Schatten)
      sun.position.set(playerPos.x + 100, playerPos.y + 150, playerPos.z + 50);
      sun.target.position.copy(playerPos);

      // 6. Umgebung animieren
      const time = performance.now() * 0.001;
      
      // Schwebende Inseln
      floatIslands.children.forEach(island => {
        island.position.y = island.userData.baseY + Math.sin(time * island.userData.speed + island.userData.offset) * 5;
        island.rotation.y += dt * 0.1;
      });

      // Orbs
      for (let i = orbs.length - 1; i >= 0; i--) {
        const orb = orbs[i];
        orb.rotation.y += dt * 3;
        orb.rotation.x += dt * 2;
        orb.position.y = orb.userData.baseY + Math.sin(time * 2 + orb.userData.phase) * 0.3;

        const dx = orb.position.x - playerPos.x;
        const dz = orb.position.z - playerPos.z;
        const dy = orb.position.y - (playerPos.y + 1);
        
        if (dx * dx + dz * dz < 3.5 && Math.abs(dy) < 2.5) {
          orbCount++;
          steps += 50;
          scene.remove(orb);
          orbs.splice(i, 1);

          // Spawn Partikel beim Einsammeln
          for(let j=0; j<10; j++) {
             const pPos = orb.position.clone();
             const p = new THREE.Mesh(particleGeo, new THREE.MeshBasicMaterial({color: 0xffd500, transparent: true, blending: THREE.AdditiveBlending}));
             p.position.copy(pPos);
             p.userData = { life: 1.0, velocity: new THREE.Vector3((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10) };
             scene.add(p);
             particles.push(p);
          }

          let ox, oz;
          do {
            ox = playerPos.x + (Math.random() - 0.5) * 1000;
            oz = playerPos.z + (Math.random() - 0.5) * 1000;
          } while (Math.abs(ox) < 10 && Math.abs(oz) < 10);
          spawnOrbAt(ox, oz);
        }
      }

      // 7. UI Update
      ui.speed.textContent = currentSpeed.toFixed(1);
      ui.steps.textContent = steps;
      ui.orbs.textContent = orbCount;
      
      const boostPercent = Math.min((steps % 1000) / 1000 * 100, 100);
      ui.boostFill.style.width = boostPercent + '%';
    }

    // ============================================================
    // CHARAKTER ANIMATION
    // ============================================================
    function animateCharacter(dt, sprinting, moving) {
      const gait = Math.min(currentSpeed / 15, 1);
      const targetFreq = sprinting ? 15 : 8;
      
      if (moving && currentSpeed > 0.5) {
        walkPhase += dt * targetFreq;
        const swing = (0.4 + gait * 0.8) * Math.sin(walkPhase);

        // Beine
        leftLeg.hip.rotation.x = swing;
        rightLeg.hip.rotation.x = -swing;
        leftLeg.knee.rotation.x = Math.max(0, -Math.sin(walkPhase)) * (0.6 + gait * 1.2);
        rightLeg.knee.rotation.x = Math.max(0, Math.sin(walkPhase)) * (0.6 + gait * 1.2);

        // Arme
        const armSwing = sprinting ? 1.2 : 0.8;
        leftArm.shoulder.rotation.x = -swing * armSwing;
        rightArm.shoulder.rotation.x = swing * armSwing;
        leftArm.elbow.rotation.x = 0.2 + Math.max(0, swing) * 0.6;
        rightArm.elbow.rotation.x = 0.2 + Math.max(0, -swing) * 0.6;

        // Körper & Kopf
        hips.position.y = 0.9 + Math.sin(walkPhase * 2) * (0.04 + gait * 0.03);
        chest.rotation.x = gait * (sprinting ? 0.4 : 0.2); // Neigung nach vorne
        chest.rotation.y = Math.sin(walkPhase) * 0.1 * gait;
        headGroup.rotation.x = -chest.rotation.x * 0.8; // Kopf bleibt gerade

      } else {
        // Idle
        walkPhase += dt * 2;
        hips.position.y = 0.9 + Math.sin(walkPhase) * 0.015;
        
        const decay = Math.pow(0.001, dt);
        leftLeg.hip.rotation.x *= decay;
        rightLeg.hip.rotation.x *= decay;
        leftLeg.knee.rotation.x *= decay;
        rightLeg.knee.rotation.x *= decay;
        leftArm.shoulder.rotation.x *= decay;
        rightArm.shoulder.rotation.x *= decay;
        leftArm.elbow.rotation.x = THREE.MathUtils.lerp(leftArm.elbow.rotation.x, 0.1, dt * 5);
        rightArm.elbow.rotation.x = THREE.MathUtils.lerp(rightArm.elbow.rotation.x, 0.1, dt * 5);
        chest.rotation.x *= decay;
        chest.rotation.y *= decay;
        headGroup.rotation.x *= decay;
      }
    }

    // ============================================================
    // MAIN LOOP
    // ============================================================
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(Math.max((now - lastTime) / 1000, 0), 0.05);
      lastTime = now;
      
      if (started) {
        update(dt);
      } else {
        // Kamera-Idle im Menü (langsames Kreisen)
        const t = now * 0.0005;
        camera.position.set(Math.sin(t) * 30, 15, Math.cos(t) * 30);
        camera.lookAt(0, 5, 0);
        
        // Inseln animieren im Hintergrund
        floatIslands.children.forEach(island => {
          island.rotation.y += 0.005;
        });
      }
      
      renderer.render(scene, camera);
    }

    // Initialer State
    playerPos.y = terrainHeight(0, 0);
    player.position.copy(playerPos);
    requestAnimationFrame(animate);

    // ============================================================
    // RESIZE
    // ============================================================
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>

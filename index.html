<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Step Rush 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: white;
      user-select: none;
    }
    canvas { display: block; touch-action: none; }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: flex-start;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,.7);
    }

    .card {
      background: rgba(15, 23, 42, .72);
      border: 1px solid rgba(96, 165, 250, .35);
      border-radius: 14px;
      padding: 10px 14px;
      min-width: 92px;
      backdrop-filter: blur(8px);
    }

    .label {
      display: block;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #93c5fd;
      margin-bottom: 2px;
    }

    .value {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
    }

    #speedBar {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: 16px;
      height: 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .8);
      border: 1px solid rgba(96, 165, 250, .35);
      overflow: hidden;
      pointer-events: none;
    }

    #speedFill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22d3ee, #3b82f6, #a855f7);
      transition: width .08s linear;
    }

    #gameover {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(2, 6, 23, .72);
      backdrop-filter: blur(6px);
      z-index: 20;
    }

    #gameover.hidden { display: none; }

    .panel {
      width: min(92vw, 420px);
      text-align: center;
      background: rgba(15, 23, 42, .95);
      border: 1px solid rgba(96, 165, 250, .45);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
    }

    .panel h1 {
      margin: 0 0 8px;
      font-size: 34px;
      letter-spacing: .03em;
    }

    .panel p {
      margin: 6px 0;
      color: #cbd5e1;
    }

    .final {
      font-size: 42px;
      font-weight: 900;
      color: #facc15;
      margin: 18px 0;
    }

    button {
      margin-top: 16px;
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      color: #082f49;
      background: linear-gradient(90deg, #22d3ee, #60a5fa);
      box-shadow: 0 10px 30px rgba(34, 211, 238, .3);
    }

    button:active { transform: translateY(1px); }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 42px;
      transform: translateX(-50%);
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 8px #000;
      width: 90%;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="card"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="card"><span class="label">Schritte</span><span class="value" id="steps">0</span></div>
    <div class="card"><span class="label">Combo</span><span class="value" id="combo">x1</span></div>
    <div class="card"><span class="label">Level</span><span class="value" id="level">1</span></div>
    <div class="card"><span class="label">Leben</span><span class="value" id="lives">❤️❤️❤️</span></div>
    <div class="card"><span class="label">Speed</span><span class="value" id="speed">8.0</span></div>
  </div>

  <div id="speedBar"><div id="speedFill"></div></div>
  <div id="hint">A/D oder ←/→ = Spur · Leertaste/W/↑ = springen · Mobil: wischen</div>

  <div id="gameover" class="hidden">
    <div class="panel">
      <h1>Game Over</h1>
      <p>Dein Run ist vorbei.</p>
      <div class="final" id="finalScore">0</div>
      <p>Punkte</p>
      <button id="restartBtn">Nochmal schneller!</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Grundsetup ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1020);
    scene.fog = new THREE.Fog(0x0b1020, 28, 95);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 250);
    camera.position.set(0, 5.4, 10);
    camera.lookAt(0, 1.2, -16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // ---------- Licht ----------
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));

    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(6, 14, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0x3b82f6, 0.9);
    rim.position.set(-8, 6, -10);
    scene.add(rim);

    // ---------- Straße ----------
    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(9, 260),
      new THREE.MeshStandardMaterial({ color: 0x141d36, roughness: 0.9, metalness: 0.1 })
    );
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0, -55);
    road.receiveShadow = true;
    scene.add(road);

    // Fahrspurlinien
    for (const x of [-1, 1]) {
      const line = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, 0.02, 260),
        new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8, emissiveIntensity: 0.7 })
      );
      line.position.set(x, 0.02, -55);
      scene.add(line);
    }

    // Neon-Seitenbegrenzungen
    for (const x of [-4.75, 4.75]) {
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.55, 260),
        new THREE.MeshStandardMaterial({ color: 0x1e40af, emissive: 0x2563eb, emissiveIntensity: 0.6 })
      );
      rail.position.set(x, 0.28, -55);
      rail.castShadow = true;
      rail.receiveShadow = true;
      scene.add(rail);
    }

    // ---------- Spieler ----------
    const player = new THREE.Group();

    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0x22d3ee,
      emissive: 0x0891b2,
      emissiveIntensity: 0.65,
      roughness: 0.35,
      metalness: 0.25
    });

    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.62), bodyMat);
    body.position.y = 0.6;
    body.castShadow = true;
    player.add(body);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 20, 20),
      new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 })
    );
    head.position.y = 1.45;
    head.castShadow = true;
    player.add(head);

    const visor = new THREE.Mesh(
      new THREE.BoxGeometry(0.46, 0.13, 0.08),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, emissive: 0x22d3ee, emissiveIntensity: 0.5 })
    );
    visor.position.set(0, 1.47, -0.33);
    player.add(visor);

    player.position.set(0, 0, 0);
    scene.add(player);

    // ---------- Spielzustand ----------
    const lanes = [-2, 0, 2];
    const maxSpeed = 38;
    const minSpeed = 8;

    let laneIndex = 1;
    let jumpY = 0;
    let velocityY = 0;
    let onGround = true;

    let speed = minSpeed;
    let steps = 0;
    let score = 0;
    let combo = 1;
    let lives = 3;
    let gameOver = false;

    let stepTimer = 0;
    let obstacleTimer = 0;

    const objects = [];

    // ---------- UI ----------
    const ui = {
      score: document.getElementById('score'),
      steps: document.getElementById('steps'),
      combo: document.getElementById('combo'),
      level: document.getElementById('level'),
      lives: document.getElementById('lives'),
      speed: document.getElementById('speed'),
      speedFill: document.getElementById('speedFill'),
      gameover: document.getElementById('gameover'),
      finalScore: document.getElementById('finalScore')
    };

    function updateUI() {
      ui.score.textContent = Math.floor(score);
      ui.steps.textContent = steps;
      ui.combo.textContent = 'x' + combo;
      ui.level.textContent = Math.floor(steps / 10) + 1;
      ui.lives.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
      ui.speed.textContent = speed.toFixed(1);
      ui.speedFill.style.width = ((speed - minSpeed) / (maxSpeed - minSpeed) * 100) + '%';
    }

    // ---------- Spawning ----------
    function spawnObstacle() {
      const lane = Math.floor(Math.random() * 3);
      const low = Math.random() < 0.38;
      const height = low ? 0.8 : 2.0;

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(low ? 1.5 : 1.1, height, 1.1),
        new THREE.MeshStandardMaterial({
          color: low ? 0xf59e0b : 0xef4444,
          emissive: low ? 0x7c2d12 : 0x7f1d1d,
          emissiveIntensity: 0.7,
          roughness: 0.4
        })
      );

      mesh.position.set(lanes[lane], height / 2, -78);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { type: 'obstacle', lane, low, hit: false };

      scene.add(mesh);
      objects.push(mesh);
    }

    function spawnStep() {
      const lane = Math.floor(Math.random() * 3);

      const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(0.35, 0.13, 10, 22),
        new THREE.MeshStandardMaterial({
          color: 0xfacc15,
          emissive: 0xf59e0b,
          emissiveIntensity: 1.2,
          roughness: 0.3,
          metalness: 0.4
        })
      );

      mesh.rotation.x = Math.PI / 2;
      mesh.position.set(lanes[lane], 1.0, -78);
      mesh.castShadow = true;
      mesh.userData = { type: 'step', lane, collected: false };

      scene.add(mesh);
      objects.push(mesh);
    }

    // ---------- Steuerung ----------
    function moveLane(dir) {
      if (gameOver) return;
      laneIndex = THREE.MathUtils.clamp(laneIndex + dir, 0, 2);
    }

    function jump() {
      if (gameOver || !onGround) return;
      velocityY = 7.6;
      onGround = false;
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLane(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') moveLane(1);
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        jump();
      }
      if (e.code === 'KeyR' && gameOver) restart();
    });

    let touchStart = null;

    renderer.domElement.addEventListener('pointerdown', (e) => {
      touchStart = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!touchStart) return;
      const dx = e.clientX - touchStart.x;
      const dy = e.clientY - touchStart.y;
      touchStart = null;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) moveLane(1);
        else if (dx < -30) moveLane(-1);
      } else if (dy < -30) {
        jump();
      }
    });

    // ---------- Neustart ----------
    function restart() {
      for (const obj of objects) scene.remove(obj);
      objects.length = 0;

      laneIndex = 1;
      jumpY = 0;
      velocityY = 0;
      onGround = true;

      speed = minSpeed;
      steps = 0;
      score = 0;
      combo = 1;
      lives = 3;
      gameOver = false;

      stepTimer = 0;
      obstacleTimer = 0.8;

      player.position.set(0, 0, 0);
      ui.gameover.classList.add('hidden');
      updateUI();
    }

    document.getElementById('restartBtn').addEventListener('click', restart);

    function endGame() {
      gameOver = true;
      ui.finalScore.textContent = Math.floor(score);
      ui.gameover.classList.remove('hidden');
    }

    // ---------- Update ----------
    function update(dt) {
      // Spur weich wechseln
      const targetX = lanes[laneIndex];
      player.position.x += (targetX - player.position.x) * Math.min(1, 13 * dt);

      // Sprungphysik
      if (!onGround) {
        velocityY -= 20 * dt;
        jumpY += velocityY * dt;
        if (jumpY <= 0) {
          jumpY = 0;
          velocityY = 0;
          onGround = true;
        }
      }
      player.position.y = jumpY;

      // Welt bewegt sich auf Spieler zu
      const dz = speed * dt;

      for (let i = objects.length - 1; i >= 0; i--) {
        const obj = objects[i];
        obj.position.z += dz;

        // Schritte einsammeln
        if (obj.userData.type === 'step') {
          if (
            obj.userData.lane === laneIndex &&
            Math.abs(obj.position.z) < 1.25 &&
            !obj.userData.collected
          ) {
            obj.userData.collected = true;
            steps += 1;
            score += 10 * combo;
            combo = Math.min(combo + 1, 25);
            speed = Math.min(maxSpeed, speed + 0.15);

            scene.remove(obj);
            objects.splice(i, 1);
            continue;
          }
        }

        // Hindernis-Kollision
        if (obj.userData.type === 'obstacle') {
          if (
            obj.userData.lane === laneIndex &&
            Math.abs(obj.position.z) < 1.25 &&
            !obj.userData.hit
          ) {
            const avoidedByJump = obj.userData.low && jumpY > 0.8;

            if (!avoidedByJump) {
              obj.userData.hit = true;
              lives -= 1;
              combo = 1;
              speed = Math.max(minSpeed, speed * 0.65);

              scene.remove(obj);
              objects.splice(i, 1);

              if (lives <= 0) {
                endGame();
                return;
              }
              continue;
            }
          }
        }

        // Weit hinter dem Spieler entfernen
        if (obj.position.z > 13) {
          scene.remove(obj);
          objects.splice(i, 1);
        }
      }

      // Passiver Score durch Geschwindigkeit
      score += speed * dt * 0.6;

      // Spawn-Timer
      stepTimer -= dt;
      if (stepTimer <= 0) {
        spawnStep();
        stepTimer = Math.max(0.32, 0.9 - speed * 0.012);
      }

      obstacleTimer -= dt;
      if (obstacleTimer <= 0) {
        spawnObstacle();
        obstacleTimer = Math.max(0.5, 1.65 - speed * 0.032);
      }

      updateUI();
    }

    // ---------- Loop ----------
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (!gameOver) update(dt);

      renderer.render(scene, camera);
    }

    updateUI();
    requestAnimationFrame(animate);

    // ---------- Resize ----------
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
